<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>My To Do list app</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=close"
    />
  </head>
  <body>
    <div class="main-container">
      <div>
        <h1>To Do</h1>
      </div>
      <div class="main-content">
        <div class="input-task">
          <input id="new-task" placeholder="Add a new task" />
          <button id="add-button">
            <span class="material-symbols-outlined" onclick="addTaskBar"> add </span>
          </button>
        </div>
        <div class="task-item" id="task-bar">
          <div class="content">
            <input type="checkbox" />
            <div class="task-text">Example of task</div>
          </div>
          <button id="delete-button">
            <span class="material-symbols-outlined"> close </span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
